name: Build SpeedTest CLI

on:
  push:
    tags:
      - 'speedtest-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. speedtest-v1.0.0)'
        required: true

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create.outputs.id }}
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Get tag
        id: tag
        run: echo "tag=${{ github.event.inputs.tag || github.ref_name }}" >> $GITHUB_OUTPUT

      - name: Create release
        id: create
        uses: actions/github-script@v7
        with:
          script: |
            const tag = '${{ steps.tag.outputs.tag }}';
            const ver = tag.replace('speedtest-', '');
            const body = [
              '## SpeedTest CLI ' + ver,
              '',
              '纯 Node.js 测速命令行工具，无需外部依赖。',
              '',
              '### 下载',
              '',
              '| 平台 | 文件 |',
              '|------|------|',
              '| Windows x64 | speedtest-windows-x64.exe |',
              '| Linux x64 | speedtest-linux-x64 |',
              '| Linux arm64 | speedtest-linux-arm64 |',
              '| macOS x64 (Intel) | speedtest-macos-x64 |',
              '| macOS arm64 (Apple Silicon) | speedtest-macos-arm64 |',
              '',
              '### 使用',
              '',
              'Windows: speedtest-windows-x64.exe',
              'Linux/macOS: chmod +x speedtest-linux-x64 && ./speedtest-linux-x64',
              '',
              '### 功能',
              '',
              '- 纯 Node.js，无需安装任何外部二进制',
              '- 自动检测运营商（电信/联通/移动/云服务商）',
              '- 根据运营商默认选择上海节点',
              '- 多流并发下载/上传',
              '- 终端实时进度条',
              '- 内置 7 个 LibreSpeed 节点 + 8 个 Ookla 节点',
              '- 自动 fallback',
              '',
              '### 参数',
              '',
              '- -s, --server <id>     指定节点 ID',
              '- -m, --mode <mode>     测速模式: libre (默认) | ookla',
              '- -l, --list            列出所有可用节点',
              '- -c, --chunk <MB>      下载块大小 (默认 100MB)',
              '- --dl-streams <n>      下载并发流 (默认 6)',
              '- --ul-streams <n>      上传并发流 (默认 3)',
              '- --dl-time <s>         下载测试时长 (默认 10s)',
              '- --ul-time <s>         上传测试时长 (默认 10s)',
            ].join('\n');
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: 'SpeedTest CLI ' + ver,
              body: body,
              draft: false,
              prerelease: false
            });
            return data.id;

  build:
    name: "${{ matrix.name }}"
    needs: create-release
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "Windows x64"
            runner: windows-latest
            target: bun-windows-x64
            output: speedtest-windows-x64.exe
          - name: "Linux x64"
            runner: ubuntu-latest
            target: bun-linux-x64
            output: speedtest-linux-x64
          - name: "Linux arm64"
            runner: ubuntu-24.04-arm
            target: bun-linux-arm64
            output: speedtest-linux-arm64
          - name: "macOS x64"
            runner: macos-latest
            target: bun-darwin-x64
            output: speedtest-macos-x64
          - name: "macOS arm64"
            runner: macos-13
            target: bun-darwin-arm64
            output: speedtest-macos-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Compile binary
        run: bun build --compile --target=${{ matrix.target }} speedtest.mjs --outfile ${{ matrix.output }}

      - name: Upload to Release
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const releaseId = ${{ needs.create-release.outputs.release_id }};
            await github.rest.repos.uploadReleaseAsset({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: releaseId,
              name: '${{ matrix.output }}',
              data: fs.readFileSync('${{ matrix.output }}')
            });
