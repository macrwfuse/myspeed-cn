name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install client dependencies
        run: cd client && bun install

      - name: Build client
        run: cd client && bun run build

      - name: Move build folder
        run: mv client/build . || true

      - name: Install server dependencies
        run: bun install

      - name: Generate migrations & integrations
        run: |
          bun run generate-migrations
          bun run generate-integrations
          bun run generate-client-embed

      - name: Build Windows x64 executable
        run: |
          bun build --compile \
            --compile-autoload-package-json \
            --external pg-hstore \
            --external pg \
            --target=bun-windows-x64 \
            server/index.js \
            --outfile MySpeed-CN.exe

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: MySpeed-CN-Windows-x64
          path: MySpeed-CN.exe

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install client dependencies
        run: cd client && bun install

      - name: Build client
        run: cd client && bun run build

      - name: Move build folder
        run: mv client/build . || true

      - name: Install server dependencies
        run: bun install

      - name: Generate migrations & integrations
        run: |
          bun run generate-migrations
          bun run generate-integrations
          bun run generate-client-embed

      - name: Build Linux x64 executable
        run: |
          bun build --compile \
            --compile-autoload-package-json \
            --external pg-hstore \
            --external pg \
            --target=bun-linux-x64 \
            server/index.js \
            --outfile MySpeed-CN

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: MySpeed-CN-Linux-x64
          path: MySpeed-CN

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install client dependencies
        run: cd client && bun install

      - name: Build client
        run: cd client && bun run build

      - name: Move build folder
        run: mv client/build . || true

      - name: Install server dependencies
        run: bun install

      - name: Generate migrations & integrations
        run: |
          bun run generate-migrations
          bun run generate-integrations
          bun run generate-client-embed

      - name: Build macOS arm64 executable
        run: |
          bun build --compile \
            --compile-autoload-package-json \
            --external pg-hstore \
            --external pg \
            --target=bun-darwin-arm64 \
            server/index.js \
            --outfile MySpeed-CN-macos-arm64

      - name: Build macOS x64 executable
        run: |
          bun build --compile \
            --compile-autoload-package-json \
            --external pg-hstore \
            --external pg \
            --target=bun-darwin-x64 \
            server/index.js \
            --outfile MySpeed-CN-macos-x64

      - name: Upload macOS arm64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: MySpeed-CN-macOS-arm64
          path: MySpeed-CN-macos-arm64

      - name: Upload macOS x64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: MySpeed-CN-macOS-x64
          path: MySpeed-CN-macos-x64

  release:
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: MySpeed-CN-Windows-x64
          path: dist/

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: MySpeed-CN-Linux-x64
          path: dist/

      - name: Download macOS arm64 artifact
        uses: actions/download-artifact@v4
        with:
          name: MySpeed-CN-macOS-arm64
          path: dist/

      - name: Download macOS x64 artifact
        uses: actions/download-artifact@v4
        with:
          name: MySpeed-CN-macOS-x64
          path: dist/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/MySpeed-CN.exe
            dist/MySpeed-CN
            dist/MySpeed-CN-macos-arm64
            dist/MySpeed-CN-macos-x64
          generate_release_notes: true
