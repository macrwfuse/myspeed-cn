name: Release MySpeed-CN

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 1.1.0)'
        required: true

jobs:
  create-release:
    name: "Create Release"
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      release_id: ${{ steps.create_release.outputs.id }}

    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version from tag
        id: get_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            VERSION="${GITHUB_REF#refs/tags/v}"
            echo "version=$VERSION" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref }}
          name: "MySpeed-CN v${{ steps.get_version.outputs.version }}"
          draft: true
          prerelease: false
          body: |
            ## MySpeed-CN v${{ steps.get_version.outputs.version }}

            ### ✨ 特性
            - 🚀 内置中国测速节点（电信/联通/教育网）
            - 🌐 新增 xxir CDN 测速节点（国内真实 CDN 多流并发测速）
            - 🖥️ Windows/Linux/macOS 独立可执行文件
            - 🐳 Docker 一键部署

            ### 📥 下载
            - `MySpeed-CN-windows-x64.exe` - Windows 可执行文件
            - `MySpeed-CN-linux-x64` - Linux x64
            - `MySpeed-CN-linux-arm64` - Linux ARM64
            - `MySpeed-CN-macos-x64` - macOS Intel
            - `MySpeed-CN-macos-arm64` - macOS Apple Silicon

            ### 🐳 Docker
            ```bash
            docker pull macrwfuse/myspeed-cn:latest
            ```

  build-binaries:
    name: "Build Binaries"
    needs: create-release
    uses: ./.github/workflows/build-binaries.yml
    with:
      version: ${{ needs.create-release.outputs.version }}
      release_id: ${{ needs.create-release.outputs.release_id }}
    secrets: inherit

  build-docker:
    name: "Build Docker"
    needs: create-release
    uses: ./.github/workflows/build-docker.yml
    with:
      version: ${{ needs.create-release.outputs.version }}
    secrets: inherit

  finalize-release:
    name: "Finalize Release"
    needs: [create-release, build-binaries, build-docker]
    runs-on: ubuntu-latest
    steps:
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.create-release.outputs.version }}
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  cleanup-on-failure:
    name: "Cleanup on Failure"
    runs-on: ubuntu-latest
    needs: [create-release, build-binaries, build-docker]
    if: failure()
    steps:
      - name: Delete release
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.repos.deleteRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: ${{ needs.create-release.outputs.release_id }}
              });
            } catch (e) {
              console.log('Failed to delete release:', e.message);
            }
      - name: Delete tag
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.git.deleteRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: 'tags/${{ github.ref_name }}'
              });
            } catch (e) {
              console.log('Failed to delete tag:', e.message);
            }
